name: Clippy Sonar Scan

on:
  workflow_call:
    inputs:
      test-id:
        description: "Identifier used to namespace the uploaded report"
        required: false
        type: string
        default: clippy-scan
      scan-cmd:
        description: "Command generating the clippy.json report"
        required: false
        type: string
        default: "make scan-reports"
      container-image:
        description: "Optional job container image. Empty runs on the runner itself"
        default: ""
        required: false
        type: string
      runner:
        description: "Runner label: ubuntu-26.04 or ubuntu-26.04-arm"
        required: false
        type: string
        default: ubuntu-26.04
      skip-save-cache-github:
        description: "Do not save the rust cache"
        required: false
        type: boolean
        default: true
      github-client-id:
        description: "Client ID of the GitHub App that mints the job token"
        required: true
        type: string
      github-app-repositories:
        description: "Repository names (same owner) the token covers, comma separated. Empty means the calling repository only; when set, list the calling repository too"
        required: false
        type: string
        default: ""
    secrets:
      github-private-key:
        description: "Private key (PEM) of the GitHub App"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy-sonar:
    name: Clippy Sonar Scan
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container-image }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ inputs.github-client-id }}
          private-key: ${{ secrets.github-private-key }}
          repositories: ${{ inputs.github-app-repositories }}
          permission-contents: read

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ inputs.skip-save-cache-github == false }}

      - name: Clippy scan
        env:
          SCOPED_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: ${{ inputs.scan-cmd }}

      - name: Rename report
        run: mv clippy.json sonar-${{ inputs.test-id }}.json

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.test-id }}
          path: sonar-${{ inputs.test-id }}.json
          retention-days: 5
