name: PR Cache Cleanup

on:
  workflow_call:
    inputs:
      ref:
        description: "The git ref for which the cache should be deleted"
        required: true
        type: string
      key:
        description: "The cache key to delete (if not provided, all caches for the ref will be deleted)"
        required: false
        type: string
      runner:
        description: "Runner label: ubuntu-26.04 or ubuntu-26.04-arm"
        required: false
        type: string
        default: ubuntu-26.04
      github-client-id:
        description: "Client ID of the GitHub App that mints the job token"
        required: true
        type: string
      github-app-repositories:
        description: "Repository names (same owner) the token covers, comma separated. Empty means the calling repository only; when set, list the calling repository too"
        required: false
        type: string
        default: ""
    secrets:
      github-private-key:
        description: "Private key (PEM) of the GitHub App"
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ inputs.github-client-id }}
          private-key: ${{ secrets.github-private-key }}
          repositories: ${{ inputs.github-app-repositories }}
          permission-actions: write

      - uses: snnaplab/delete-branch-cache-action@20f7992a7b8b51aa719420d11b32c9d34a5eb362 # v1.0.0
        with:
          ref: ${{ inputs.ref }}
          key: ${{ inputs.key }}
          github-token: ${{ steps.generate-token.outputs.token }}
