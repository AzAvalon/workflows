name: Checks

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label: ubuntu-26.04 or ubuntu-26.04-arm"
        required: false
        type: string
        default: ubuntu-26.04
      rust-version:
        description: "Rust toolchain used by the hooks"
        required: false
        type: string
        # renovate: datasource=github-releases depName=rust-lang/rust
        default: "1.100.0"
      python-version:
        description: "Python version used by the hooks"
        required: false
        type: string
        # renovate: datasource=python-version depName=python versioning=python
        default: "3.15"
      setup-pre-commit-cmd:
        description: "Optional command to install extra tools before running pre-commit checks"
        required: false
        type: string
        default: ""
      github-client-id:
        description: "Client ID of the GitHub App that mints the job token"
        required: true
        type: string
      github-app-repositories:
        description: "Repository names (same owner) the token covers, comma separated. Empty means the calling repository only; when set, list the calling repository too"
        required: false
        type: string
        default: ""
    secrets:
      github-private-key:
        description: "Private key (PEM) of the GitHub App"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy, rustfmt

      - name: Setup pre-commit dependencies
        if: ${{ inputs.setup-pre-commit-cmd != '' }}
        run: ${{ inputs.setup-pre-commit-cmd }}

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ inputs.github-client-id }}
          private-key: ${{ secrets.github-private-key }}
          repositories: ${{ inputs.github-app-repositories }}
          permission-pull-requests: read

      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          prek-version: "0.5.10"

      - name: Prek Run
        run: |
          prek run --all-files --show-diff-on-failure
