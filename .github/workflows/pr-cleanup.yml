name: PR Cleanup

# Deletes the images and charts a pull request pushed to GHCR once it is
# closed, merged or not. Fork PRs never push, so they are skipped. Run it by
# hand with a PR number to retry the cleanup of a PR closed earlier.

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Number of the closed pull request to clean up"
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/_pr_packages_cleanup.yml
    permissions:
      contents: read
      packages: write
    with:
      packages: dummy-service,charts/dummy-service
      pr-number: ${{ inputs.pr-number }}
